[package]
name = "akashboard-engine"
version = "0.1.0"
edition = "2021"
description = "Prediction and learning engine for AkashBoard keyboard"
authors = ["Akash Priyadarshi"]
license = "GPL-3.0"

[lib]
name = "predictor"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_benchmarks"
harness = false

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Single codegen unit for max optimization
strip = true         # Strip debug symbols
panic = "abort"      # Abort on panic (smaller binary)
