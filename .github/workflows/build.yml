name: Build & Release AkashBoard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch vendored sherpa-onnx native libraries
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          bash tools/fetch-sherpa-onnx.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akashboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Update Release Asset (v0.1)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" app/build/outputs/apk/release/AkashBoard-v0.1.0.apk
          echo "Uploading $APK_FILE and AkashBoard-v0.1.0.apk to release v0.1..."
          gh release upload v0.1 "$APK_FILE" app/build/outputs/apk/release/AkashBoard-v0.1.0.apk --clobber
