<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&amp;family=IBM+Plex+Mono:wght@700&amp;family=Inter:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#2A2A2A" stroke-width="1"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#2A2A2A" stroke-width="1"/>
  </g>

  <!-- Top label -->
  <text x="80" y="100" font-family="Archivo, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#D34E24" text-transform="uppercase">PRIVACY-FIRST ANDROID KEYBOARD</text>

  <!-- Main headline -->
  <text x="80" y="200" font-family="Archivo, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" letter-spacing="-2">Nothing leaves</text>
  <text x="80" y="280" font-family="Archivo, sans-serif" font-weight="900" font-size="72" fill="#FFFFFF" letter-spacing="-2">your phone.</text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="Inter, sans-serif" font-weight="300" font-size="20" fill="#C0C0C0">Zero telemetry. Sub-millisecond Rust engine. 2 MB.</text>

  <!-- Stat callouts -->
  <g transform="translate(80, 420)">
    <!-- Stat 1 -->
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="48" fill="#D34E24">0.00 bytes</text>
    <text x="0" y="28" font-family="Archivo, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#6B6B6B">MAX TELEMETRY</text>
  </g>

  <g transform="translate(350, 420)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="48" fill="#D34E24">&lt; 0.01 ms</text>
    <text x="0" y="28" font-family="Archivo, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#6B6B6B">RESPONSE TIME</text>
  </g>

  <g transform="translate(640, 420)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="48" fill="#D34E24">2.00 MB</text>
    <text x="0" y="28" font-family="Archivo, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#6B6B6B">INSTALL SIZE</text>
  </g>

  <g transform="translate(890, 420)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="48" fill="#D34E24">0</text>
    <text x="0" y="28" font-family="Archivo, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#6B6B6B">CLOUD DEPS</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#D34E24"/>
  <text x="80" y="616" font-family="Archivo, sans-serif" font-weight="900" font-size="14" letter-spacing="0.05em" fill="#0A0A0A">AKASHBOARD</text>
  <text x="1060" y="616" font-family="IBM Plex Mono, monospace" font-weight="400" font-size="12" fill="#0A0A0A" text-anchor="end">v1.0 &middot; GPLv3 &middot; FOSS</text>
</svg>
